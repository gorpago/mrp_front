<!DOCTYPE html>
<html>
<head>
    <title>네이버 로그인 콜백</title>
</head>
<body>
    <div style="text-align: center; padding: 50px;">
        <h2>네이버 로그인 처리 중...</h2>
        <p>잠시만 기다려주세요.</p>
    </div>

    <script>
        console.log('=== 네이버 콜백 HTML 로드됨 ===');
        console.log('현재 URL:', window.location.href);

        // URL 파라미터 파싱
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const state = urlParams.get('state');
        const error = urlParams.get('error');

        console.log('URL 파라미터:', { code, state, error });

        if (code) {
            console.log('네이버 인증 코드 발견:', code);
            
            // 백엔드 API 호출 시도
            fetch('/api/auth/naver/token', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    code: code,
                    state: state,
                    redirectUri: 'http://localhost:3000/naver-callback.html'
                })
            })
            .then(response => {
                console.log('백엔드 응답 상태:', response.status);
                if (response.ok) {
                    return response.json();
                }
                throw new Error('백엔드 API 실패');
            })
            .then(data => {
                console.log('백엔드 API 성공:', data);
                
                // 성공 메시지 전달
                if (window.opener && !window.opener.closed) {
                    window.opener.postMessage({
                        type: 'NAVER_LOGIN_SUCCESS',
                        userInfo: data.userInfo
                    }, window.location.origin);
                }
                
                // 창 닫기
                setTimeout(() => {
                    window.close();
                }, 500);
            })
            .catch(error => {
                console.error('백엔드 API 실패, 네이버 API 직접 호출:', error);
                handleNaverApiDirectly(code);
            });
        }

        // 네이버 API 직접 호출
        async function handleNaverApiDirectly(code) {
            const CLIENT_ID = 'POFsQ7wbhDndWfVxDe6G';
            const CLIENT_SECRET = 'NvQ5sJ3wtW';
            const REDIRECT_URI = 'http://localhost:3000/naver-callback.html';
            
            try {
                console.log('네이버 API 직접 호출 시작:', code);
                
                // 토큰 요청
                const tokenResponse = await fetch('https://nid.naver.com/oauth2.0/token', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        grant_type: 'authorization_code',
                        client_id: CLIENT_ID,
                        client_secret: CLIENT_SECRET,
                        code: code,
                        redirect_uri: REDIRECT_URI
                    })
                });

                const tokenData = await tokenResponse.json();
                console.log('네이버 토큰 응답:', tokenData);
                
                if (tokenData.error) {
                    throw new Error(`네이버 토큰 오류: ${tokenData.error_description}`);
                }

                // 사용자 정보 요청
                const userResponse = await fetch('https://openapi.naver.com/v1/nid/me', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${tokenData.access_token}`
                    }
                });

                const userData = await userResponse.json();
                console.log('네이버 사용자 정보:', userData);
                
                if (userData.resultcode !== '00') {
                    throw new Error(`네이버 사용자 정보 오류: ${userData.message}`);
                }

                const userInfo = userData.response;
                
                // 실제 사용자 정보 전달
                if (window.opener && !window.opener.closed) {
                    window.opener.postMessage({
                        type: 'NAVER_LOGIN_SUCCESS',
                        userInfo: {
                            id: userInfo.id,
                            email: userInfo.email,
                            name: userInfo.name,
                            picture: userInfo.profile_image,
                            accessToken: tokenData.access_token
                        }
                    }, window.location.origin);
                }
                
                console.log('실제 네이버 사용자 정보 전달 완료');
                
            } catch (error) {
                console.error('네이버 API 호출 실패:', error);
                
                // 더미 데이터 전달
                if (window.opener && !window.opener.closed) {
                    window.opener.postMessage({
                        type: 'NAVER_LOGIN_SUCCESS',
                        userInfo: {
                            id: 'naver_frontend_' + Date.now(),
                            email: 'frontend@naver.com',
                            name: '네이버 사용자 (더미)',
                            picture: 'https://ssl.pstatic.net/static/pwe/address/img_profile.png',
                            accessToken: 'mock_naver_token_' + code.substring(0, 10)
                        }
                    }, window.location.origin);
                }
            }
            
            // 창 닫기
            setTimeout(() => {
                window.close();
            }, 500);
        }
    </script>
</body>
</html>
