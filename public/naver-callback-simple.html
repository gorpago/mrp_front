<!DOCTYPE html>
<html>
<head>
    <title>네이버 로그인 콜백</title>
    <script>
        console.log('=== 간단한 네이버 콜백 HTML 로드됨 ===');
        console.log('현재 URL:', window.location.href);

        // URL 파라미터 파싱
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const state = urlParams.get('state');

        console.log('URL 파라미터:', { code, state });

        if (code) {
            console.log('네이버 인증 코드 발견:', code);
            
            // 네이버 API 직접 호출
            handleNaverApi(code);
        } else {
            console.log('인증 코드가 없습니다.');
            sendError('인증 코드가 없습니다.');
        }

        async function handleNaverApi(code) {
            const CLIENT_ID = 'POFsQ7wbhDndWfVxDe6G';
            const CLIENT_SECRET = 'NvQ5sJ3wtW';
            const REDIRECT_URI = 'http://localhost:3000/naver-callback-simple.html';
            
            try {
                console.log('네이버 API 호출 시작:', code);
                
                // 1단계: 토큰 요청
                console.log('1단계: 토큰 요청 시작');
                const tokenResponse = await fetch('https://nid.naver.com/oauth2.0/token', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        grant_type: 'authorization_code',
                        client_id: CLIENT_ID,
                        client_secret: CLIENT_SECRET,
                        code: code,
                        redirect_uri: REDIRECT_URI
                    })
                });

                console.log('토큰 응답 상태:', tokenResponse.status);
                const tokenData = await tokenResponse.json();
                console.log('토큰 응답 데이터:', tokenData);
                
                if (tokenData.error) {
                    throw new Error(`토큰 오류: ${tokenData.error_description}`);
                }

                // 2단계: 사용자 정보 요청
                console.log('2단계: 사용자 정보 요청 시작');
                const userResponse = await fetch('https://openapi.naver.com/v1/nid/me', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${tokenData.access_token}`
                    }
                });

                console.log('사용자 정보 응답 상태:', userResponse.status);
                const userData = await userResponse.json();
                console.log('사용자 정보 응답 데이터:', userData);
                
                if (userData.resultcode !== '00') {
                    throw new Error(`사용자 정보 오류: ${userData.message}`);
                }

                const userInfo = userData.response;
                
                // 실제 사용자 정보 전달
                console.log('실제 네이버 사용자 정보:', userInfo);
                sendSuccess({
                    id: userInfo.id,
                    email: userInfo.email,
                    name: userInfo.name,
                    picture: userInfo.profile_image,
                    accessToken: tokenData.access_token
                });
                
            } catch (error) {
                console.error('네이버 API 호출 실패:', error);
                console.error('오류 상세:', error.message);
                
                // 더미 데이터로 fallback
                console.log('더미 데이터로 fallback');
                sendSuccess({
                    id: 'naver_frontend_' + Date.now(),
                    email: 'frontend@naver.com',
                    name: '네이버 사용자 (더미)',
                    picture: 'https://ssl.pstatic.net/static/pwe/address/img_profile.png',
                    accessToken: 'mock_naver_token_' + code.substring(0, 10)
                });
            }
        }

        function sendSuccess(userInfo) {
            console.log('성공 메시지 전달:', userInfo);
            if (window.opener && !window.opener.closed) {
                window.opener.postMessage({
                    type: 'NAVER_LOGIN_SUCCESS',
                    userInfo: userInfo
                }, window.location.origin);
            }
            
            // 창 닫기
            setTimeout(() => {
                window.close();
            }, 1000);
        }

        function sendError(error) {
            console.log('오류 메시지 전달:', error);
            if (window.opener && !window.opener.closed) {
                window.opener.postMessage({
                    type: 'NAVER_LOGIN_ERROR',
                    error: error
                }, window.location.origin);
            }
            
            // 창 닫기
            setTimeout(() => {
                window.close();
            }, 1000);
        }
    </script>
</head>
<body>
    <div style="text-align: center; padding: 50px;">
        <h2>네이버 로그인 처리 중...</h2>
        <p>잠시만 기다려주세요.</p>
        <div id="status">처리 중...</div>
    </div>
</body>
</html>
